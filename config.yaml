# ============================================================================
#  Réglages communs du bot WikiMasters (partagés sur GitHub).
#
#  NE MODIFIEZ PAS CE FICHIER pour vos réglages : mettez-les dans perso.yaml (copie de
#  perso.exemple.yaml), qui n'est jamais envoyé sur GitHub. Il suffit d'y écrire ce que vous
#  changez ; tout le reste vient d'ici. Le script vérifie l'ensemble au démarrage.
#
#  Commandes (Windows : wm au lieu de ./wm) :
#    ./wm login                  ajoute un compte (voir README)
#    ./wm tout                   simulation : montre ce qui serait fait
#    ./wm tout --execute         le fait pour de vrai
#    ./wm tout --execute --loop  recommence toutes les 15 minutes (Ctrl+C pour arrêter)
#
#  Les noms d'étiquettes ignorent majuscules, accents, espaces et le « # » affiché par le site :
#  « Lyon », « lyon » et « #lyon » sont la même étiquette, tout comme « Défausse » et « defausse ».
#
#  Pour garder une carte que le script voudrait défausser ou vendre : ajoutez-lui une étiquette de
#  protection (« garder ») sur le site. Retirer « defausse » ne suffit pas : « analyser » la remettrait.
# ============================================================================

site:
  base_url: "https://www.wiki-masters.com"
  # Base de données utilisée par le site (étiquettes, connexion).
  supabase_url: "https://cyrxjeppjqsxxjayfrur.supabase.co"
  # Clé publique ("anon") intégrée au site : ce n'est pas un secret, elle est la même pour tous.
  supabase_anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5cnhqZXBwanFzeHhqYXlmcnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4ODAzMzksImV4cCI6MjA4OTQ1NjMzOX0.BZluyXygNxuQGDPxFX1zG5i-cqp10CVK-8GGtuak4Rg"
  # Les sessions (créées par « login ») sont dans comptes/<nom>/, jamais envoyé sur GitHub.

# ----------------------------------------------------------------------------
# Protections : ces cartes ne sont JAMAIS défaussées ni vendues, quelles que soient leurs étiquettes.
# Les listes de perso.yaml (tags, rarities, name_contains) s'ajoutent à celles-ci, sans jamais en retirer.
# ----------------------------------------------------------------------------
protection:
  tags: ["garder", "favori"]   # étiquettes qui protègent une carte (ajoutez les vôtres dans perso.yaml)
  starred: true         # cartes mises en favori (étoile)
  shiny: true           # cartes shiny
  rarities: ["SR", "L"] # raretés à ne jamais toucher (vues sur le site : C, PC, R, SR, L)
  unprotected_rarities: []  # parmi elles, celles traitées comme les autres cartes (étiquette de prix, vente,
                            # défausse), ex. ["SR"] : perso.yaml ne peut pas retirer une rareté de la liste ci-dessus
  name_contains: []     # ex. ["Lyon", "Olympique"] : nom de carte contenant un de ces mots
  # Les cartes engagées dans un échange en cours sont toujours protégées.

# ----------------------------------------------------------------------------
# Prix : valeur d'une carte = prix moyen de ses ventes passées, pour sa rareté (donnée du site).
# ----------------------------------------------------------------------------
price:
  cache_hours: 24        # prix lus gardés 24 h : un passage interrompu reprend sans tout relire (0 = jamais)
                         # pour tout relire sur le site malgré le cache : option --fresh
  cache_file: "prix_cache.json"

# ----------------------------------------------------------------------------
# Étiquettes de prix (commande « analyser ») : une étiquette par tranche de prix moyen.
# Une tranche couvre les valeurs >= from et < below. Les tranches doivent se suivre sans trou.
# ----------------------------------------------------------------------------
price_tags:
  bands:
    - { tag: "defausse", below: 5,              color: "#a855f7" }
    - { tag: "+5",       from: 5,    below: 10,   color: "#f59e0b" }
    - { tag: "+10",      from: 10,   below: 100,  color: "#6366f1" }
    - { tag: "+100",     from: 100,  below: 500,  color: "#22c55e" }
    - { tag: "+500",     from: 500,  below: 1000, color: "#8b5cf6" }
    - { tag: "+1000",    from: 1000,              color: "#16a34a" }
  unknown_tag: "inconnu"       # étiquette pour les cartes jamais vendues, ex. "inconnu" (null = ne rien poser)
  remove_outdated: true   # retirer l'ancienne étiquette de prix quand la carte change de tranche
  retired: []             # étiquettes d'une tranche supprimée, retirées par « analyser », ex. ["+5"] après avoir
                          # fusionné « +5 » dans « defausse » (n'oubliez pas sell.tags)
  tag_protected: false    # true = étiqueter aussi les cartes protégées (elles restent protégées) ; false = une carte
                          # protégée n'a pas d'étiquette de prix : celles qu'elle a sont retirées (un filtre par
                          # prix sur le site, pour un échange, ne la montre plus)

# Étiquettes supplémentaires posées par « analyser » selon des conditions (combinées en ET).
# Conditions : name_contains (un texte, ou une liste : l'un d'eux), name_words (noms en mots entiers),
# text_contains / text_excludes (titre ou description de la carte, en début de mot : « pnl » trouve
# « chanson de PNL »), rarity_in, shiny, min_value, max_value.
# Une règle sans min_value ni max_value s'applique aussi aux cartes protégées. Exemples :
#   - tag: "à surveiller"
#     color: "#eab308"
#     when: { min_value: 50, rarity_in: ["R", "SR"] }
#   - tag: "garder"            # « garder » est dans protection.tags : la carte devient protégée
#     when: { name_contains: "Lyon" }
auto_tags: []

# ----------------------------------------------------------------------------
# Défausse (commande « defausser ») : une défausse rapporte 1 wikicoin et est IRRÉVERSIBLE.
# ----------------------------------------------------------------------------
discard:
  tags: ["defausse"]      # défausse les cartes portant une de ces étiquettes (posées par analyser ou à la main)
  accounts: null          # comptes qui défaussent, ex. ["moncompte"] (null = tous) ; les autres gardent tout
  max_value: 5            # garde-fou : ne défausse jamais une carte dont le prix moyen actuel est >= 5 (null = pas de vérification ;
                          # une carte « inconnu » qui s'est vendue depuis n'est alors jamais défaussée)
  unknown_rarities: ["C", "PC", "R"]  # cartes jamais vendues (étiquette « inconnu ») défaussées aussi, pour ces
                                      # raretés ([] = jamais). SR et L sont protégées (protection.rarities).
  max_per_run: 200        # au plus N défausses par passage (la suite au passage suivant)
  fresh_price: true       # prix relu sur le site pendant le passage, juste avant de défausser (au lieu du cache)
  require_existing_tag: false  # true = ne défausser qu'au passage suivant celui qui a posé « defausse »
                               # (pour avoir le temps de vérifier) ; false = dès le premier passage
  # Invendues (mises aux enchères sans trouver d'acheteur) qui valent moins de unsold_max_value : défaussées au lieu
  # d'être relancées (une relance partirait à 1 ou 2 wikicoins et occuperait une place d'enchère), prix relu sur le
  # site juste avant. Les cartes jamais mises en vente attendent leur tour.
  unsold_max_value: null  # ex. 10 (null = toujours relancer, voir sell.relist)

# ----------------------------------------------------------------------------
# Ventes aux enchères (commande « vendre »).
# ----------------------------------------------------------------------------
sell:
  tags: ["+1000", "+500", "+100", "+10", "+5"]   # met aux enchères les cartes portant une de ces étiquettes
  accounts: null          # comptes qui mettent des cartes aux enchères, ex. ["moncompte"] (null = tous) ; les
                          # autres font seulement le bilan de leurs enchères en cours (et défaussent)
  order: "random"         # random : au hasard | value : les plus chères d'abord | tags : dans l'ordre de la liste, puis par prix
  price_factor: 0.75      # mise de départ = prix moyen × 0,75…
  rounding: "floor"       # … arrondie à l'inférieur (floor), au plus proche (round) ou au supérieur (ceil)
  min_start_price: 1      # mise de départ minimale
  max_start_price: null   # mise de départ maximale (null = pas de plafond)
  duration_minutes: 30    # durée : 10, 30, 60, 180, 360 ou 720 (10 min, 30 min, 1 h, 3 h, 6 h, 12 h)
  long_duration: null     # ex. { from_value: 100, minutes: 30 } : enchères plus longues pour les cartes qui valent
                          # au moins from_value (null = toutes durent duration_minutes)
  max_auctions: 5         # enchères lancées au plus par passage (le site en autorise 5 en même temps)
  min_value: 5            # garde-fou : ne vend jamais une carte dont le prix moyen est < 5 (null = pas de vérification)
  fresh_price: false      # true = relire le prix sur le site avant de vendre (sinon : cache de price.cache_hours)
  require_existing_tag: false  # true = ne vendre que les cartes déjà étiquetées au début du passage
  # La nuit, presque personne n'achète : entre ces deux heures (celles de l'ordinateur), aucune mise en vente ni
  # relance, et aucune enchère lancée avant ne s'y termine. Boosters, défausses et achats continuent.
  # Heures entre guillemets ; null = vendre à toute heure.
  night: { start: "23:00", end: "08:00" }
  # Heures de pointe : enchères plus courtes entre ces deux heures (celles de l'ordinateur), ex.
  # { start: "18:00", end: "22:00", duration_minutes: 10 }. Les mises en vente partent alors une par une, toutes les
  # 6 min (safety.market_limit réparti sur l'heure) : il y en a toujours une en cours. market_limit: 30 remplace
  # safety.market_limit.count pendant ce créneau (compte qui vend) : les 5 places restent pleines. null = jamais.
  peak: null
  # Relance des invendus : une carte revenue sans acheteur est remise en vente moins cher.
  relist:
    enabled: true
    factor: 0.8           # nouvelle mise = mise précédente × 0,8 (arrondie comme ci-dessus)
    min_start_price: 1    # mise minimale d'une relance
    max_attempts: 3       # au-delà de 3 mises en vente sans acheteur, on ne relance plus
    first: true           # les relances passent avant les nouvelles ventes

# ----------------------------------------------------------------------------
# Boosters (commande « boosters », ou au début de « tout » avec in_tout: true).
# ----------------------------------------------------------------------------
packs:
  in_tout: false          # true = « tout » ouvre d'abord les boosters disponibles (leurs cartes sont triées ensuite)
  accounts: null          # comptes qui ouvrent des boosters, ex. ["moncompte"] (null = tous) : chaque booster compte
                          # dans safety.market_limit, donc moins de ventes pour un compte qui vend
  every_minutes: null     # « tout » n'essaie d'en ouvrir qu'une fois toutes les N minutes, ex. 180 (null = à chaque passage)
  max_blocks: 3           # après N vérifications anti-robot de suite à leur ouverture (une ouverture réussie remet le
                          # compte à zéro), « tout » arrête les boosters… (null = ne jamais arrêter)
  retry_hours: 6          # … et n'en essaie plus qu'un seul toutes les N heures, pour voir si c'est encore bloqué.
                          # Ouvert, tout repart normalement. La commande « boosters » les ouvre quand même
  max_per_run: 10         # au plus N boosters ouverts par passage
  delay_seconds: 12       # pause entre deux boosters : enchaînés en quelques secondes, ils déclenchent la
                          # vérification anti-robot du site (les boosters sont alors en pause 1 h, puis 2 h, 4 h…)

# ----------------------------------------------------------------------------
# Achats aux enchères (commande « acheter », ou pendant « tout --loop » si keywords n'est pas vide).
# Le script repère sur le marché les annonces dont le titre ou la catégorie contient un mot-clé, puis mise
# le minimum quand il reste snipe_seconds secondes, sans jamais dépasser le prix moyen de la carte.
# Il revérifie quelques secondes avant la fin et remise si quelqu'un l'a dépassé, aussitôt si sa mise est refusée
# parce qu'un autre joueur vient de miser, et suit l'enchère quand le site la prolonge (toujours sous le plafond).
# ----------------------------------------------------------------------------
buy:
  keywords: []            # mots cherchés sur le marché, ex. ["lyon"] ([] = aucun achat), en début de mot :
                          # « lyon » trouve « lyonnais » ou « To-Lyon », pas « Elyon »
  tag: null               # étiquette posée sur les cartes gagnées. Elle doit être dans protection.tags,
                          # sinon « analyser » pourrait les revendre ou les défausser. Ex. "lyon"
  keyword_tags: {}        # étiquette(s) selon un texte du titre ou de la catégorie (sinon tag), chacune dans
                          # protection.tags, ex. { pnl: "pnl", "olympique lyonnais": ["lyon", "OL"] }
  names: []               # cartes cherchées par leur nom (ex. ["Rayan Cherki"]). Chacun est cherché à son tour,
                          # environ toutes les names_minutes : une recherche par nom renvoie toutes ses annonces,
                          # même lointaines, et le site met parfois 30 s à répondre à chaque recherche
  names_tags: null        # étiquette(s) des cartes trouvées par leur nom, ex. ["lyon", "OL"] (null = tag)
  names_minutes: 60
  price_factor: 1.0       # plafond = prix moyen de la carte × 1,0 ; null = pas de plafond lié au prix
  max_price: null         # plafond absolu par carte, en wikibidous (null = pas d'autre plafond)
  buy_unknown: false      # true = acheter aussi les cartes jamais vendues (prix inconnu), plafonnées par max_price
  skip_owned: true        # ignorer les cartes déjà dans votre collection
  snipe_seconds: 20       # mise quand il reste N secondes (10 au moins)
  last_check_seconds: 6   # dernière vérification (et surenchère si dépassé) quand il reste N secondes
  bid_on_sight: false     # true = première mise dès que l'annonce est repérée, sans attendre snipe_seconds
  exclude: []             # annonces ignorées si leur titre ou catégorie contient un de ces mots, ex. ["Lyons"]
  scan_minutes: 5         # le marché est relu toutes les N minutes
  accounts: null          # comptes qui achètent, ex. ["moncompte"] (noms : ./wm comptes) ; les autres n'achètent
                          # rien. null = tous vos comptes

# ----------------------------------------------------------------------------
# Envoi de cartes à un autre de VOS comptes (commande « envoyer », ou pendant « tout » avec in_tout: true), par
# échanges sans contrepartie, pour que ce soit lui qui les vende. Les deux comptes doivent être amis sur le site et
# enregistrés ici (./wm login) : le script n'envoie jamais rien à un autre joueur. Une carte protégée n'est jamais
# envoyée (ses étiquettes ne la suivent pas). Les cartes n'arrivent qu'une fois l'échange accepté par l'autre compte.
# ----------------------------------------------------------------------------
send:
  to: null                # compte qui reçoit, ex. "moncompte2" (noms : ./wm comptes), ou --vers NOM
  tags: null              # étiquettes des cartes envoyées, ex. ["+10"], ou --etiquette +10 (null = sell.tags)
  in_tout: false          # true = « tout » envoie ces cartes avant les ventes, sur tous les comptes sauf celui qui
                          # reçoit (le même perso.yaml sert aux deux)
  batch_size: 20          # cartes par échange : le site a refusé 100 cartes d'un coup (16/10/2026). Après un
                          # refus, les cartes sont reproposées par lots deux fois plus petits
  max_per_run: 100        # au plus N cartes envoyées par passage (la suite au passage suivant)
  delay_seconds: 20       # pause entre deux échanges

# ----------------------------------------------------------------------------
# Garde-fous et rythme.
# ----------------------------------------------------------------------------
safety:
  max_actions_per_run: 10000        # au plus N actions (étiquettes, défausses, ventes) par passage ; relancez pour continuer
  delay_seconds: 1.5              # pause après chaque action
  auction_delay_seconds: 45       # pause après chaque mise en vente : enchaînées en quelques secondes, elles
                                  # déclenchent la vérification anti-robot du site
  read_delay_seconds: 1.8         # pause après chaque lecture de prix
  max_consecutive_errors: 3       # arrêt après N actions refusées d'affilée
  max_consecutive_read_failures: 5  # arrêt après N prix illisibles d'affilée
  market_limit: { count: 10, minutes: 60, bids: 4 }  # par compte, au plus « count » actions sur le marché
                          # (mises, mises en vente, boosters) en « minutes », dont au plus « bids » nouvelles
                          # mises : le reste est pour les ventes. Plus vite, le site bloque tout le marché du
                          # compte (vu le 16/10/2026 : 10 actions en 25 min). null = pas de limite
  shared_market: false    # true = vos comptes lancés sur cet ordinateur partagent cette limite et la pause anti-robot.
                          # Inutile a priori : le site bloque chaque compte séparément (17/10/2026 : un compte bloqué
                          # sur un booster, l'autre ouvrait et misait encore juste après)

# ----------------------------------------------------------------------------
# Journal : une ligne par action réelle (étiquettes, ventes, relances, défausses, ventes terminées).
# ----------------------------------------------------------------------------
journal:
  enabled: true
  file: "journal.csv"
  delimiter: ";"          # « ; » pour Excel en français, « , » sinon

display:
  verbose: false          # true = toujours tout afficher (comme --verbose)
  waiting_shown: 5        # nombre de cartes « en attente d'une place d'enchère » affichées

# ----------------------------------------------------------------------------
# Notifications Telegram
# ----------------------------------------------------------------------------
# Notification à la fin de chaque passage. Le jeton du bot et votre chat_id vont dans perso.yaml
# (voir perso.exemple.yaml), JAMAIS dans ce fichier : sans eux, pas de notification.
telegram:
  notify_on_dry_run: false   # true = notifier aussi les simulations (false = seulement les passages --execute)
  every_pass: false          # true = un bilan à chaque passage ; false = seulement quand il faut agir : vérification
                             # anti-robot (aussitôt), arrêt, plantage, mise en veille (une fois par problème)
  daily_report: null         # ex. "22:00" : bilan de la journée de chaque compte, une fois par jour après cette heure

